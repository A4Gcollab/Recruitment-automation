# Reverse-proxy vhost for the A4G recruitment app, for the VPS's existing system
# nginx. This only adds a new site — it does not touch other vhosts on the box.
#
# Install (on the VPS):
#   sudo cp deploy/nginx/RecSup.omysha.org.conf /etc/nginx/sites-available/RecSup.omysha.org
#   sudo ln -s /etc/nginx/sites-available/RecSup.omysha.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (certbot edits ONLY this vhost, adding the :443 server + cert):
#   sudo certbot --nginx -d RecSup.omysha.org
#
# Requires DNS A record RecSup.omysha.org -> 139.84.154.64 to resolve first.

server {
    listen 80;
    listen [::]:80;
    server_name RecSup.omysha.org;

    # Allow large-ish bodies for XLSX import/export round-trips.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
